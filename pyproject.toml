[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmove"
version = "0.1.0"
description = "Motor cuantitativo de valoración y gestión de riesgos de portafolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.16.3",
    "yfinance==0.2.66",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantmove*"]
